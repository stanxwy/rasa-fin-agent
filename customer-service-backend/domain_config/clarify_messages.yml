clarify_messages:
  missing_track: "你是想先办理业务，还是先咨询信息呢？"
  multiple_tracks: "你这次同时提到了多个方向。我们先处理一个，你想先办业务还是先咨询信息呢？"
  missing_task_commands: "你这次是想办理什么业务呢？比如查询账户、查询交易流水，或者转账。"
  missing_knowledge_intent: "你是想了解账户信息、交易流水，还是理财产品信息呢？"
  missing_focused_object: "请先发送你想咨询的对象（如账户号、卡号、产品编码等），我再继续帮你看。"
  object_requires_order: "我已经收到这个订单了。你想查订单状态、查物流，还是申请退款呢？"
  object_requires_product: "我已经收到这个商品了。你想了解它的商品信息、发货情况，还是售后相关问题呢？"
  object_requires_bank_account: "我已经收到这个银行账户了。你想查账户余额、交易流水，还是账户状态呢？"
  object_requires_bank_card: "我已经收到这张银行卡了。你想查卡状态、卡类型，还是绑定账户信息呢？"
  object_requires_credit_card: "我已经收到这张信用卡了。你想查额度、账单，还是还款信息呢？"
  object_requires_deposit: "我已经收到这个存款产品了。你想了解利率、起存金额，还是存期信息呢？"
  object_requires_loan: "我已经收到这个贷款对象了。你想查贷款产品利率、合同详情，还是还款计划呢？"
  object_requires_wealth_product: "我已经收到这个理财产品了。你想了解风险等级、预期收益率，还是起购金额呢？"
  object_requires_fund_product: "我已经收到这个基金产品了。你想了解基金类型、净值，还是风险等级呢？"
  object_requires_transaction: "我已经收到这个交易流水了。你想了解交易金额、交易状态，还是交易对手信息呢？"
  object_requires_transfer: "我已经收到这个转账记录了。你想查转账金额、转账状态，还是收款方信息呢？"
  fallback: "我还需要再确认一下你的意思，你可以换个更具体的说法告诉我。"
