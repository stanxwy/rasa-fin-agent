<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据库表关系图 - 金融客服系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f1117;
  --panel: #1a1d29;
  --border: #2a2d3a;
  --text: #e0e0e0;
  --text-dim: #888;
  --accent: #4fc3f7;
  --header-h: 56px;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 13px;
}

/* ── 顶部工具栏 ── */
.toolbar {
  position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px; z-index: 100;
}
.toolbar h1 { font-size: 15px; font-weight: 600; white-space: nowrap; }
.toolbar .search-box {
  position: relative;
}
.toolbar input[type="text"] {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 6px 12px 6px 32px;
  font-size: 13px;
  width: 240px;
  outline: none;
}
.toolbar input[type="text"]:focus { border-color: var(--accent); }
.toolbar .search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text-dim); font-size: 14px;
}
.toolbar .btn {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  padding: 6px 14px;
  cursor: pointer;
  font-size: 12px;
  transition: all .15s;
  white-space: nowrap;
}
.toolbar .btn:hover { color: var(--accent); border-color: var(--accent); }
.toolbar .btn.active { color: var(--accent); border-color: var(--accent); background: rgba(79,195,247,0.1); }
.toolbar .spacer { flex: 1; }
.toolbar .info { font-size: 11px; color: var(--text-dim); white-space: nowrap; }

/* ── 域过滤侧栏 ── */
.domain-filter {
  position: fixed; top: var(--header-h); left: 0;
  width: 180px; bottom: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 12px;
  overflow-y: auto;
  z-index: 90;
}
.domain-filter h3 { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
.domain-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 5px; cursor: pointer;
  transition: background .12s;
}
.domain-item:hover { background: rgba(255,255,255,0.04); }
.domain-item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.domain-item .label { font-size: 12px; }
.domain-item .count { font-size: 11px; color: var(--text-dim); margin-left: auto; }
.domain-item.disabled { opacity: 0.35; }

/* ── 画布区域 ── */
.canvas-wrapper {
  position: fixed;
  top: var(--header-h); left: 180px; right: 0; bottom: 0;
  overflow: hidden;
  cursor: grab;
  background:
    radial-gradient(circle at 50% 50%, rgba(79,195,247,0.02) 0%, transparent 60%),
    var(--bg);
}
.canvas-wrapper.panning { cursor: grabbing; }
.canvas-wrapper::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

#canvas {
  position: absolute;
  transform-origin: 0 0;
  width: 1px; height: 1px;
}

/* ── SVG 连线层 ── */
#svg-layer {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  overflow: visible;
}
.fk-line {
  fill: none;
  stroke-width: 1.5;
  opacity: 0.25;
  transition: opacity .2s, stroke-width .2s;
}
.fk-line.highlight { opacity: 0.9; stroke-width: 2.5; }
.fk-line.dim { opacity: 0.05; }

/* ── 表卡片 ── */
.table-card {
  position: absolute;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 240px;
  cursor: move;
  user-select: none;
  transition: box-shadow .15s, border-color .15s, opacity .2s;
  z-index: 10;
}
.table-card:hover { border-color: rgba(79,195,247,0.4); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
.table-card.dragging { z-index: 999; box-shadow: 0 8px 30px rgba(0,0,0,0.5); cursor: grabbing; }
.table-card.highlight { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,195,247,0.3); }
.table-card.dim { opacity: 0.2; }
.table-card.hidden { display: none; }

.table-card .card-header {
  padding: 8px 12px;
  border-radius: 8px 8px 0 0;
  font-weight: 600;
  font-size: 12px;
  display: flex; align-items: center; gap: 6px;
  border-bottom: 1px solid var(--border);
}
.table-card .card-header .collapse-btn {
  margin-left: auto;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1;
}
.table-card .card-header .collapse-btn:hover { color: var(--accent); }

.table-card .card-body { padding: 6px 0; }
.table-card .card-body.collapsed { display: none; }

.table-card .field {
  padding: 2px 12px;
  font-size: 11px;
  color: var(--text-dim);
  display: flex; align-items: center; gap: 6px;
}
.table-card .field.pk { color: #ffb74d; font-weight: 600; }
.table-card .field.fk { color: var(--accent); }
.table-card .field .key-icon { font-size: 10px; width: 14px; text-align: center; flex-shrink: 0; }
.table-card .field .field-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.table-card .field .field-type { font-size: 10px; color: #555; }

.table-card .card-comment {
  padding: 4px 12px 6px;
  font-size: 10px;
  color: #555;
  border-top: 1px solid var(--border);
  line-height: 1.4;
}

/* ── 域颜色 ── */
.domain-dim       { background: #2d3561; }
.domain-customer  { background: #1a4a3a; }
.domain-account   { background: #3d2d1a; }
.domain-tx        { background: #2a1a3d; }
.domain-wealth    { background: #1a2d4a; }
.domain-loan      { background: #4a1a2d; }
.domain-repay     { background: #3d3d1a; }
.domain-risk      { background: #4a2d1a; }
.domain-collect   { background: #2d4a4a; }
.domain-ops       { background: #2d2d2d; }

.border-dim       { border-top: 3px solid #5b6db8; }
.border-customer  { border-top: 3px solid #4caf50; }
.border-account   { border-top: 3px solid #ff9800; }
.border-tx        { border-top: 3px solid #ab47bc; }
.border-wealth    { border-top: 3px solid #42a5f5; }
.border-loan      { border-top: 3px solid #ef5350; }
.border-repay     { border-top: 3px solid #d4e157; }
.border-risk      { border-top: 3px solid #ff7043; }
.border-collect   { border-top: 3px solid #26a69a; }
.border-ops       { border-top: 3px solid #78909c; }

.color-dim       { color: #5b6db8; }
.color-customer  { color: #4caf50; }
.color-account   { color: #ff9800; }
.color-tx        { color: #ab47bc; }
.color-wealth    { color: #42a5f5; }
.color-loan      { color: #ef5350; }
.color-repay     { color: #d4e157; }
.color-risk      { color: #ff7043; }
.color-collect   { color: #26a69a; }
.color-ops       { color: #78909c; }

/* ── 缩放指示 ── */
.zoom-indicator {
  position: fixed; bottom: 16px; right: 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 11px; color: var(--text-dim);
  z-index: 80;
}

/* ── 加载提示 ── */
.loading {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: var(--text-dim); font-size: 16px;
}
</style>
</head>
<body>

<!-- ── 顶部工具栏 ── -->
<div class="toolbar">
  <h1>金融客服系统 - 数据库表关系图</h1>
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="搜索表名或注释..." />
  </div>
  <button class="btn active" id="btn-lines">显示连线</button>
  <button class="btn" id="btn-collapse">全部折叠</button>
  <button class="btn" id="btn-expand">全部展开</button>
  <button class="btn" id="btn-fit">缩放至适应</button>
  <button class="btn" id="btn-reset">重置布局</button>
  <div class="spacer"></div>
  <div class="info" id="info">共 0 张表</div>
</div>

<!-- ── 域过滤侧栏 ── -->
<div class="domain-filter" id="domain-filter">

</div>

<!-- ── 画布 ── -->
<div class="canvas-wrapper" id="wrapper">
  <div id="canvas">
    <svg id="svg-layer"></svg>
  </div>
</div>

<div class="zoom-indicator" id="zoom-indicator">100%</div>

// ══════════════════════════════════════════════════════════════════
// 域配置
// ══════════════════════════════════════════════════════════════════
const DOMAIN_CONFIG = {
  dim:      { label: '维表',     color: '#5b6db8' },
  customer: { label: '客户域',   color: '#4caf50' },
  account:  { label: '账户域',   color: '#ff9800' },
  tx:       { label: '交易域',   color: '#ab47bc' },
  wealth:   { label: '理财域',   color: '#42a5f5' },
  loan:     { label: '信贷域',   color: '#ef5350' },
  repay:    { label: '还款域',   color: '#d4e157' },
  risk:     { label: '风控域',   color: '#ff7043' },
  collect:  { label: '催收域',   color: '#26a69a' },
  ops:      { label: '运营域',   color: '#78909c' },
};

// ══════════════════════════════════════════════════════════════════
// 状态
// ══════════════════════════════════════════════════════════════════
let tableMap = {};       // name -> table data
let cardElements = {};   // name -> DOM element
let positions = {};      // name -> {x, y}
let scale = 1;
let panX = 0, panY = 0;
let showLines = true;
let activeDomains = new Set(Object.keys(DOMAIN_CONFIG));
let allCollapsed = false;

// ══════════════════════════════════════════════════════════════════
// 初始化
// ══════════════════════════════════════════════════════════════════
function init() {
  // 构建 tableMap
  TABLES.forEach(t => { tableMap[t.name] = t; });

  // 初始布局：按域分组，网格排列
  layoutByDomain();

  // 渲染域过滤侧栏
  renderDomainFilter();

  // 渲染表卡片
  renderCards();

  // 渲染连线
  renderLines();

  // 绑定事件
  bindEvents();

  // 更新信息
  document.getElementById('info').textContent = `共 ${TABLES.length} 张表`;
}

// ══════════════════════════════════════════════════════════════════
// 按域分组布局
// ══════════════════════════════════════════════════════════════════
function layoutByDomain() {
  const domainOrder = ['dim','customer','account','tx','wealth','loan','repay','risk','collect','ops'];
  const colSpacing = 300;
  const rowSpacing = 180;
  const tablesPerRow = 4;

  let col = 0, row = 0;
  for (const domain of domainOrder) {
    const domainTables = TABLES.filter(t => t.domain === domain);
    domainTables.forEach((t, i) => {
      positions[t.name] = { x: col * colSpacing, y: row * rowSpacing };
      col++;
      if (col >= tablesPerRow) { col = 0; row++; }
    });
    if (col > 0) { col = 0; row++; }
    row += 0.5; // 域之间留间距
  }
}

// ══════════════════════════════════════════════════════════════════
// 渲染域过滤侧栏
// ══════════════════════════════════════════════════════════════════
function renderDomainFilter() {
  const container = document.getElementById('domain-filter');
  const domainOrder = ['dim','customer','account','tx','wealth','loan','repay','risk','collect','ops'];
  for (const domain of domainOrder) {
    const config = DOMAIN_CONFIG[domain];
    const count = TABLES.filter(t => t.domain === domain).length;
    const item = document.createElement('div');
    item.className = 'domain-item';
    item.dataset.domain = domain;
    item.innerHTML = `
      <span class="dot" style="background:${config.color}"></span>
      <span class="label">${config.label}</span>
      <span class="count">${count}</span>
    `;
    item.addEventListener('click', () => {
      if (activeDomains.has(domain)) {
        activeDomains.delete(domain);
        item.classList.add('disabled');
      } else {
        activeDomains.add(domain);
        item.classList.remove('disabled');
      }
      applyFilters();
    });
    container.appendChild(item);
  }
}

// ══════════════════════════════════════════════════════════════════
// 渲染表卡片
// ══════════════════════════════════════════════════════════════════
function renderCards() {
  const canvas = document.getElementById('canvas');
  const svg = document.getElementById('svg-layer');

  TABLES.forEach(table => {
    const card = document.createElement('div');
    card.className = `table-card border-${table.domain}`;
    card.dataset.tableName = table.name;
    card.dataset.domain = table.domain;

    const pos = positions[table.name];
    card.style.left = pos.x + 'px';
    card.style.top = pos.y + 'px';

    // 头部
    let html = `<div class="card-header domain-${table.domain}">
      <span class="color-${table.domain}" style="font-size:11px">■</span>
      <span>${table.name}</span>
      <span class="collapse-btn" data-collapsed="false">▼</span>
    </div>`;

    // 字段
    html += '<div class="card-body">';
    table.fields.forEach(f => {
      let cls = 'field';
      let icon = '';
      if (f.pk) { cls += ' pk'; icon = '🔑'; }
      else if (f.fk) { cls += ' fk'; icon = '🔗'; }
      html += `<div class="${cls}">
        <span class="key-icon">${icon}</span>
        <span class="field-name">${f.n}</span>
        <span class="field-type">${f.t}</span>
      </div>`;
    });
    html += '</div>';

    // 注释
    html += `<div class="card-comment">${table.comment}</div>`;

    card.innerHTML = html;
    canvas.appendChild(card);
    cardElements[table.name] = card;

    // 拖拽
    makeDraggable(card, table.name);

    // 折叠
    const collapseBtn = card.querySelector('.collapse-btn');
    collapseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const body = card.querySelector('.card-body');
      const comment = card.querySelector('.card-comment');
      const isCollapsed = collapseBtn.dataset.collapsed === 'true';
      if (isCollapsed) {
        body.classList.remove('collapsed');
        comment.style.display = '';
        collapseBtn.dataset.collapsed = 'false';
        collapseBtn.textContent = '▼';
      } else {
        body.classList.add('collapsed');
        comment.style.display = 'none';
        collapseBtn.dataset.collapsed = 'true';
        collapseBtn.textContent = '▶';
      }
      renderLines();
    });

    // hover 高亮关联表和连线
    card.addEventListener('mouseenter', () => highlightRelations(table.name));
    card.addEventListener('mouseleave', () => clearHighlight());
  });
}

// ══════════════════════════════════════════════════════════════════
// 拖拽
// ══════════════════════════════════════════════════════════════════
function makeDraggable(card, tableName) {
  let startX, startY, startLeft, startTop, isDragging = false;

  card.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('collapse-btn')) return;
    isDragging = true;
    card.classList.add('dragging');
    startX = e.clientX;
    startY = e.clientY;
    startLeft = positions[tableName].x;
    startTop = positions[tableName].y;
    e.preventDefault();
    e.stopPropagation();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = (e.clientX - startX) / scale;
    const dy = (e.clientY - startY) / scale;
    positions[tableName].x = startLeft + dx;
    positions[tableName].y = startTop + dy;
    card.style.left = positions[tableName].x + 'px';
    card.style.top = positions[tableName].y + 'px';
    renderLines();
  });

  document.addEventListener('mouseup', () => {
    if (isDragging) {
      isDragging = false;
      card.classList.remove('dragging');
    }
  });
}

// ══════════════════════════════════════════════════════════════════
// 渲染连线（SVG 贝塞尔曲线）
// ══════════════════════════════════════════════════════════════════
function renderLines() {
  const svg = document.getElementById('svg-layer');
  svg.innerHTML = '';
  if (!showLines) return;

  // 收集所有 FK 关系
  const relations = [];
  TABLES.forEach(table => {
    table.fields.forEach(f => {
      if (f.fk) {
        const [refTable, refCol] = f.fk.split('.');
        if (tableMap[refTable] && cardElements[refTable] && cardElements[table.name]) {
          relations.push({ from: table.name, to: refTable, fromField: f.n, toField: refCol });
        }
      }
    });
  });

  relations.forEach(rel => {
    const fromCard = cardElements[rel.from];
    const toCard = cardElements[rel.to];
    if (fromCard.style.display === 'none' || toCard.style.display === 'none') return;

    const fromPos = positions[rel.from];
    const toPos = positions[rel.to];
    const fromW = fromCard.offsetWidth || 240;
    const fromH = fromCard.offsetHeight || 60;
    const toW = toCard.offsetWidth || 240;
    const toH = toCard.offsetHeight || 60;

    // 计算连接点（取最近的边）
    const fromCx = fromPos.x + fromW / 2;
    const fromCy = fromPos.y + fromH / 2;
    const toCx = toPos.x + toW / 2;
    const toCy = toPos.y + toH / 2;

    let x1, y1, x2, y2;
    // 判断从哪条边出
    const dx = toCx - fromCx;
    const dy = toCy - fromCy;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0) { x1 = fromPos.x + fromW; y1 = fromCy; }
      else { x1 = fromPos.x; y1 = fromCy; }
    } else {
      if (dy > 0) { x1 = fromCx; y1 = fromPos.y + fromH; }
      else { x1 = fromCx; y1 = fromPos.y; }
    }
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0) { x2 = toPos.x; y2 = toCy; }
      else { x2 = toPos.x + toW; y2 = toCy; }
    } else {
      if (dy > 0) { x2 = toCx; y2 = toPos.y; }
      else { x2 = toCx; y2 = toPos.y + toH; }
    }

    // 贝塞尔控制点
    const mx = (x1 + x2) / 2;
    const my = (y1 + y2) / 2;
    const path = `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;

    const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    pathEl.setAttribute('d', path);
    pathEl.setAttribute('class', 'fk-line');

    // 颜色按来源表域
    const table = tableMap[rel.from];
    const config = DOMAIN_CONFIG[table.domain];
    pathEl.setAttribute('stroke', config.color);

    pathEl.dataset.from = rel.from;
    pathEl.dataset.to = rel.to;
    svg.appendChild(pathEl);
  });
}

// ══════════════════════════════════════════════════════════════════
// 高亮关联
// ══════════════════════════════════════════════════════════════════
function getRelations(tableName) {
  const related = new Set();
  TABLES.forEach(table => {
    table.fields.forEach(f => {
      if (f.fk) {
        const refTable = f.fk.split('.')[0];
        if (table.name === tableName) related.add(refTable);
        if (refTable === tableName) related.add(table.name);
      }
    });
  });
  return related;
}

function highlightRelations(tableName) {
  const related = getRelations(tableName);
  related.add(tableName);

  // 高亮卡片
  Object.keys(cardElements).forEach(name => {
    if (related.has(name)) {
      cardElements[name].classList.add('highlight');
      cardElements[name].classList.remove('dim');
    } else {
      cardElements[name].classList.add('dim');
      cardElements[name].classList.remove('highlight');
    }
  });

  // 高亮连线
  document.querySelectorAll('.fk-line').forEach(line => {
    if (line.dataset.from === tableName || line.dataset.to === tableName) {
      line.classList.add('highlight');
      line.classList.remove('dim');
    } else {
      line.classList.add('dim');
      line.classList.remove('highlight');
    }
  });
}

function clearHighlight() {
  Object.values(cardElements).forEach(card => {
    card.classList.remove('highlight', 'dim');
  });
  document.querySelectorAll('.fk-line').forEach(line => {
    line.classList.remove('highlight', 'dim');
  });
}

// ══════════════════════════════════════════════════════════════════
// 应用过滤
// ══════════════════════════════════════════════════════════════════
function applyFilters() {
  const searchTerm = document.getElementById('search').value.toLowerCase().trim();
  let visibleCount = 0;

  TABLES.forEach(table => {
    const card = cardElements[table.name];
    const domainVisible = activeDomains.has(table.domain);
    const searchMatch = !searchTerm ||
      table.name.toLowerCase().includes(searchTerm) ||
      table.comment.toLowerCase().includes(searchTerm);

    if (domainVisible && searchMatch) {
      card.style.display = '';
      visibleCount++;
    } else {
      card.style.display = 'none';
    }
  });

  document.getElementById('info').textContent = `共 ${TABLES.length} 张表（显示 ${visibleCount}）`;
  renderLines();
}

// ══════════════════════════════════════════════════════════════════
// 平移和缩放
// ══════════════════════════════════════════════════════════════════
function updateTransform() {
  const canvas = document.getElementById('canvas');
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  document.getElementById('zoom-indicator').textContent = Math.round(scale * 100) + '%';
}

function fitToView() {
  // 计算所有卡片的边界
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  TABLES.forEach(t => {
    const pos = positions[t.name];
    const card = cardElements[t.name];
    if (!card || card.style.display === 'none') return;
    const w = card.offsetWidth || 240;
    const h = card.offsetHeight || 60;
    minX = Math.min(minX, pos.x);
    minY = Math.min(minY, pos.y);
    maxX = Math.max(maxX, pos.x + w);
    maxY = Math.max(maxY, pos.y + h);
  });
  if (minX === Infinity) return;

  const wrapper = document.getElementById('wrapper');
  const ww = wrapper.clientWidth;
  const wh = wrapper.clientHeight;
  const cw = maxX - minX;
  const ch = maxY - minY;

  const padding = 40;
  scale = Math.min((ww - padding * 2) / cw, (wh - padding * 2) / ch, 1);
  panX = padding - minX * scale;
  panY = padding - minY * scale;
  updateTransform();
}

// ══════════════════════════════════════════════════════════════════
// 绑定事件
// ══════════════════════════════════════════════════════════════════
function bindEvents() {
  // 搜索
  document.getElementById('search').addEventListener('input', applyFilters);

  // 显示/隐藏连线
  document.getElementById('btn-lines').addEventListener('click', function() {
    showLines = !showLines;
    this.classList.toggle('active', showLines);
    this.textContent = showLines ? '显示连线' : '隐藏连线';
    renderLines();
  });

  // 全部折叠
  document.getElementById('btn-collapse').addEventListener('click', () => {
    Object.values(cardElements).forEach(card => {
      const btn = card.querySelector('.collapse-btn');
      const body = card.querySelector('.card-body');
      const comment = card.querySelector('.card-comment');
      body.classList.add('collapsed');
      comment.style.display = 'none';
      btn.dataset.collapsed = 'true';
      btn.textContent = '▶';
    });
    allCollapsed = true;
    setTimeout(renderLines, 50);
  });

  // 全部展开
  document.getElementById('btn-expand').addEventListener('click', () => {
    Object.values(cardElements).forEach(card => {
      const btn = card.querySelector('.collapse-btn');
      const body = card.querySelector('.card-body');
      const comment = card.querySelector('.card-comment');
      body.classList.remove('collapsed');
      comment.style.display = '';
      btn.dataset.collapsed = 'false';
      btn.textContent = '▼';
    });
    allCollapsed = false;
    setTimeout(renderLines, 50);
  });

  // 适应屏幕
  document.getElementById('btn-fit').addEventListener('click', fitToView);

  // 重置布局
  document.getElementById('btn-reset').addEventListener('click', () => {
    layoutByDomain();
    TABLES.forEach(t => {
      const card = cardElements[t.name];
      if (card) {
        card.style.left = positions[t.name].x + 'px';
        card.style.top = positions[t.name].y + 'px';
      }
    });
    scale = 1; panX = 0; panY = 0;
    updateTransform();
    renderLines();
  });

  // 画布平移
  const wrapper = document.getElementById('wrapper');
  let panning = false, panStartX, panStartY, panOriginX, panOriginY;

  wrapper.addEventListener('mousedown', (e) => {
    if (e.target.closest('.table-card')) return;
    panning = true;
    panStartX = e.clientX;
    panStartY = e.clientY;
    panOriginX = panX;
    panOriginY = panY;
    wrapper.classList.add('panning');
  });

  document.addEventListener('mousemove', (e) => {
    if (!panning) return;
    panX = panOriginX + (e.clientX - panStartX);
    panY = panOriginY + (e.clientY - panStartY);
    updateTransform();
  });

  document.addEventListener('mouseup', () => {
    if (panning) {
      panning = false;
      wrapper.classList.remove('panning');
    }
  });

  // 缩放
  wrapper.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    const newScale = Math.max(0.2, Math.min(3, scale * delta));

    // 以鼠标为中心缩放
    const rect = wrapper.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    panX = mx - (mx - panX) * (newScale / scale);
    panY = my - (my - panY) * (newScale / scale);
    scale = newScale;
    updateTransform();
  }, { passive: false });
}

// ══════════════════════════════════════════════════════════════════
// 启动
// ══════════════════════════════════════════════════════════════════
init();
setTimeout(() => {
  fitToView();
  renderLines();
}, 100);
</script>
